name: Package visual evidence

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/package-visual-evidence.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control

      - name: Check out immutable visual source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 23308322684fc24ba237065d06a279d8f472effe
          path: source

      - name: Verify and package exact artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          import struct
          from pathlib import Path

          candidate = "247207e89b2fc5bffc2bc18c8f84e015dc6b7dcc"
          source_commit = "23308322684fc24ba237065d06a279d8f472effe"
          artifact_name = "015a-247207e-visual-review"
          manifest_path = Path("control/.github/visual-artifacts/015a-247207e-manifest.json")
          source_dir = Path("source/015a") / candidate
          output_dir = Path("artifact")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_metadata = {
              "project": "ZMCENTR",
              "phase": "015A",
              "application_candidate_sha": candidate,
              "public_archive_image_commit_sha": source_commit,
              "artifact_name": artifact_name,
              "synthetic_only": True,
              "real_business_data": False,
          }
          for key, expected in expected_metadata.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f"manifest {key} mismatch")

          images = manifest.get("images")
          if not isinstance(images, list) or len(images) != 11:
              raise SystemExit("manifest must describe exactly 11 images")
          expected_names = [item.get("filename") for item in images]
          if len(set(expected_names)) != 11 or any(Path(name).name != name for name in expected_names):
              raise SystemExit("manifest filenames must be unique basenames")
          actual_names = sorted(path.name for path in source_dir.glob("*.png"))
          if sorted(expected_names) != actual_names:
              raise SystemExit("immutable source PNG set differs from manifest")

          output_dir.mkdir()
          for item in images:
              source = source_dir / item["filename"]
              data = source.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"invalid PNG signature/IHDR: {source.name}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (item["width"], item["height"]):
                  raise SystemExit(f"dimension mismatch: {source.name}")
              if hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch: {source.name}")
              shutil.copyfile(source, output_dir / source.name)

          (output_dir / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          entries = sorted(path.name for path in output_dir.iterdir())
          if entries != sorted(expected_names + ["manifest.json"]):
              raise SystemExit("artifact directory does not contain exactly 12 expected files")
          print("ARTIFACT_PRE_UPLOAD_SHA256=PASS_11_OF_11")
          print("ARTIFACT_FILE_COUNT=12")
          print("ARTIFACT_UNEXPECTED_FILES=0")
          PY

      - name: Upload visual review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 015a-247207e-visual-review
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 90

  package_dikidi_journal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control

      - name: Check out immutable DIKIDI journal screenshots
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f8c4032aac589358b27882729058f9ebec55e3d8
          path: source

      - name: Verify exact synthetic screenshot set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          import json
          import shutil
          import struct
          from pathlib import Path

          candidate = "1a589e5ef2b16b2071d552801e032e8190e14130"
          image_commit = "f8c4032aac589358b27882729058f9ebec55e3d8"
          root = Path("source/dikidi-journal") / candidate
          manifest = json.loads((Path("control/dikidi-journal") / candidate / "manifest.json").read_text())
          if any((manifest.get(k) != v) for k, v in {
              "project": "ZMCENTR", "phase": "DIKIDI-JOURNAL",
              "application_candidate_sha": candidate, "visual_image_commit_sha": image_commit,
              "synthetic_only": True, "privacy_scan": "PASS", "private_public_identity": "PASS"
          }.items()):
              raise SystemExit("manifest metadata mismatch")
          screenshots = manifest.get("screenshots")
          names = ["desktop-preview.png", "desktop-owner-open.png", "iphone-owner-open.png", "iphone-staff-resolved.png"]
          if not isinstance(screenshots, list) or [item.get("filename") for item in screenshots] != names:
              raise SystemExit("screenshot allow-list mismatch")
          if sorted(p.name for p in root.glob("*.png")) != sorted(names):
              raise SystemExit("immutable source PNG set mismatch")
          dest = Path("artifact")
          dest.mkdir()
          for item in screenshots:
              source = root / item["filename"]
              data = source.read_bytes()
              if data[:8] != bytes.fromhex("89504e470d0a1a0a") or data[12:16] != b"IHDR":
                  raise SystemExit("PNG signature mismatch")
              if struct.unpack(">II", data[16:24]) != (item["width"], item["height"]):
                  raise SystemExit("PNG dimension mismatch")
              if hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise SystemExit("PNG SHA-256 mismatch")
              shutil.copyfile(source, dest / source.name)
          (dest / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          if sorted(p.name for p in dest.iterdir()) != sorted(names + ["manifest.json"]):
              raise SystemExit("artifact entries mismatch")
          print("DIKIDI_JOURNAL_ARTIFACT_SHA256=PASS_4_OF_4")
          print("DIKIDI_JOURNAL_ARTIFACT_FILE_COUNT=5")
          PYCODE

      - name: Upload DIKIDI journal visual review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dikidi-journal-1a589e5-visual-review
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 90

  package_dikidi_day_scope:
    runs-on: ubuntu-latest
    steps:
      - name: Check out binding manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control

      - name: Check out immutable screenshot bytes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 87a80268f769ca97288a7807b8861af5a00ee51d
          path: source

      - name: Verify anonymous public URLs and package exact images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          import json
          import shutil
          import struct
          import subprocess
          from pathlib import Path

          candidate="97290aefb0c45e47e912ae7fb7e5158bcca390f9"
          image_commit="87a80268f769ca97288a7807b8861af5a00ee51d"
          root=Path("source/dikidi-journal")/candidate
          manifest=json.loads((Path("control/dikidi-journal")/candidate/"manifest.json").read_text())
          for key,value in {"project":"ZMCENTR","phase":"DIKIDI-JOURNAL-DAY-SCOPE",
              "application_candidate_sha":candidate,"visual_image_commit_sha":image_commit,
              "synthetic_only":True,"privacy_scan":"PASS","private_public_identity":"PASS"}.items():
              if manifest.get(key)!=value: raise SystemExit("manifest metadata mismatch: "+key)
          items=manifest.get("screenshots")
          names=["desktop-two-day-preview.png","iphone-day-assignments.png"]
          if not isinstance(items,list) or [i.get("filename") for i in items]!=names:
              raise SystemExit("allow-list mismatch")
          if sorted(p.name for p in root.glob("*.png"))!=sorted(names):
              raise SystemExit("immutable PNG set mismatch")
          out=Path("artifact-day")
          out.mkdir()
          for i in items:
              b=(root/i["filename"]).read_bytes()
              if b[:8]!=bytes.fromhex("89504e470d0a1a0a") or b[12:16]!=b"IHDR":
                  raise SystemExit("bad PNG signature")
              if struct.unpack(">II",b[16:24])!=(i["width"],i["height"]):
                  raise SystemExit("wrong PNG dimensions")
              if hashlib.sha256(b).hexdigest()!=i["sha256"]:
                  raise SystemExit("wrong PNG SHA")
              url="https://raw.githubusercontent.com/llllllloading/zmcentr-visual-evidence/"+image_commit+"/dikidi-journal/"+candidate+"/"+i["filename"]
              if i["raw_url"]!=url: raise SystemExit("raw URL mismatch")
              result=subprocess.run(["curl","-fLsS","--max-time","30","-w","%{http_code} %{content_type}",
                  "-o",str(out/i["filename"]),url],capture_output=True,text=True,check=True)
              if result.stdout.strip()!="200 image/png":
                  raise SystemExit("anonymous raw URL HTTP/MIME mismatch: "+result.stdout)
              if (out/i["filename"]).read_bytes()!=b:
                  raise SystemExit("anonymous raw URL bytes mismatch")
          (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          if sorted(p.name for p in out.iterdir())!=sorted(names+["manifest.json"]):
              raise SystemExit("artifact entries mismatch")
          print("ANONYMOUS_RAW_PNG_HTTP_200_SHA=PASS_2_OF_2")
          print("DAY_SCOPE_ARTIFACT_FILE_COUNT=3")
          PYCODE

      - name: Upload day-scoped journal visual artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dikidi-journal-97290ae-day-scope-visual-review
          path: artifact-day/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  package_dikidi_auto_assignment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out binding manifest
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
      - name: Check out immutable daily assignment screenshots
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 81f72f59be870be74b36ea13c03ac27f596adcf0
          path: source
      - name: Verify and package exact synthetic screenshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, json, struct, subprocess
          from pathlib import Path
          candidate="890040fde6fec481888b30d04fae4902928e816b"
          image_commit="81f72f59be870be74b36ea13c03ac27f596adcf0"
          phase="dikidi-journal-auto-assignment"
          root=Path("source")/phase/candidate
          manifest=json.loads((Path("control")/phase/candidate/"manifest.json").read_text())
          for key,value in {"project":"ZMCENTR","phase":"DIKIDI-JOURNAL-AUTO-ASSIGNMENT",
              "application_candidate_sha":candidate,"visual_image_commit_sha":image_commit,
              "synthetic_only":True,"privacy_scan":"PASS","private_public_identity":"PASS"}.items():
              if manifest.get(key)!=value: raise SystemExit("manifest mismatch: "+key)
          items=manifest.get("screenshots")
          names=["desktop-auto-day-preview.png","iphone-auto-day-preview.png"]
          if not isinstance(items,list) or [item.get("filename") for item in items]!=names:
              raise SystemExit("allow-list mismatch")
          if sorted(p.name for p in root.glob("*.png"))!=names:
              raise SystemExit("unexpected PNG in immutable source")
          out=Path("artifact-auto")
          out.mkdir()
          for item in items:
              data=(root/item["filename"]).read_bytes()
              if data[:8]!=bytes.fromhex("89504e470d0a1a0a") or data[12:16]!=b"IHDR":
                  raise SystemExit("invalid PNG")
              if struct.unpack(">II",data[16:24])!=(item["width"],item["height"]):
                  raise SystemExit("wrong PNG dimensions")
              if hashlib.sha256(data).hexdigest()!=item["sha256"]:
                  raise SystemExit("wrong PNG SHA")
              url="https://raw.githubusercontent.com/llllllloading/zmcentr-visual-evidence/"+image_commit+"/"+phase+"/"+candidate+"/"+item["filename"]
              if item["raw_url"]!=url: raise SystemExit("wrong URL binding")
              fetched=subprocess.run(["curl","-fLsS","--max-time","30","-w","%{http_code} %{content_type}",
                  "-o",str(out/item["filename"]),url],capture_output=True,text=True,check=True)
              if fetched.stdout.strip()!="200 image/png" or (out/item["filename"]).read_bytes()!=data:
                  raise SystemExit("anonymous raw bytes mismatch")
          (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          if sorted(p.name for p in out.iterdir())!=sorted(names+["manifest.json"]):
              raise SystemExit("unexpected artifact entry")
          print("AUTO_ASSIGNMENT_ARTIFACT_SHA256=PASS_2_OF_2")
          PYCODE
      - name: Upload daily header assignment visual artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dikidi-journal-890040f-auto-assignment
          path: artifact-auto/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

